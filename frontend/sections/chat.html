<!-- =====================================================
     ALPHA - AI CHAT COMPONENT
     File: frontend/sections/chat.html
     ===================================================== -->

<section id="chat-page" class="page">

    <div class="chat-layout">

        <!-- CHAT HISTORY -->
        <aside class="chat-history">
            <div class="history-header">
                <div>
                    <span class="page-label">
                        AI TUTOR
                    </span>
                    <h2>
                        Chat History
                    </h2>
                </div>
                <button
                    class="new-chat-btn"
                    onclick="startNewChat()"
                    title="Start a new chat"
                >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>
                        New Chat
                    </span>
                </button>
            </div>

            <div class="history-search">
                <span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input
                    type="text"
                    id="history-search"
                    placeholder="Search chats..."
                    oninput="searchHistory()"
                    autocomplete="off"
                >
            </div>

            <div
                id="history-list"
                class="history-list"
            ></div>
        </aside>

        <!-- CHAT MAIN -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-ai-info">
                    <div class="chat-ai-avatar">
                        α
                    </div>
                    <div>
                        <h2>
                            Alpha
                        </h2>
                        <span>
                            <i></i>
                            AI Student Tutor
                        </span>
                    </div>
                </div>

                <button
                    type="button"
                    class="chat-refresh-btn"
                    onclick="refreshChat()"
                    title="Refresh and backup chat"
                    aria-label="Refresh and backup chat"
                >
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
                </button>
            </div>

            <div
                id="chat-box"
                class="chat-box"
            >
                <div class="chat-welcome" id="chat-welcome">
                    <div class="chat-welcome-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>
                    </div>

                    <h1>
                        How can I help you today?
                    </h1>

                    <p>
                        Ask Alpha anything about your syllabus, homework, or exam prep.
                    </p>

                    <div class="chat-suggestions">
                        <button
                            type="button"
                            onclick="useChatSuggestion('Explain Python in simple words')"
                        >
                            <span class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                            </span>
                            <strong>
                                Explain Python
                            </strong>
                            <small>
                                in simple words
                            </small>
                        </button>

                        <button
                            type="button"
                            onclick="useChatSuggestion('Help me prepare for my exam')"
                        >
                            <span class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                            </span>
                            <strong>
                                Exam Preparation
                            </strong>
                            <small>
                                Create a study plan
                            </small>
                        </button>

                        <button
                            type="button"
                            onclick="useChatSuggestion('Explain this topic with an example')"
                        >
                            <span class="suggestion-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>
                            </span>
                            <strong>
                                Learn a Topic
                            </strong>
                            <small>
                                With simple examples
                            </small>
                        </button>
                    </div>
                </div>
            </div>

            <!-- CHAT COMPOSER -->
            <div class="chat-composer">
                <div class="plus-menu-container">
                    <button
                        type="button"
                        class="plus-btn"
                        onclick="togglePlusMenu()"
                        title="More options"
                        aria-label="More options"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>

                    <div
                        id="plus-menu"
                        class="plus-menu"
                    >
                        <button
                            type="button"
                            onclick="startVoiceInput(); closePlusMenu()"
                        >
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                            </span>
                            <div>
                                <strong>
                                    Voice
                                </strong>
                                <small>
                                    Speak to Alpha
                                </small>
                            </div>
                        </button>

                        <button
                            type="button"
                            onclick="openCamera(); closePlusMenu()"
                        >
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                            </span>
                            <div>
                                <strong>
                                    Photo
                                </strong>
                                <small>
                                    Add an image
                                </small>
                            </div>
                        </button>

                        <label
                            for="document-input"
                            class="plus-menu-item"
                            onclick="closePlusMenu()"
                        >
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            </span>
                            <div>
                                <strong>
                                    Document
                                </strong>
                                <small>
                                    Add a file
                                </small>
                            </div>
                        </label>
                    </div>
                </div>

                <textarea
                    id="message"
                    rows="1"
                    placeholder="Ask Alpha anything..."
                    autocomplete="off"
                ></textarea>

                <button
                    type="button"
                    class="send-btn"
                    onclick="sendMessage()"
                    title="Send message"
                    aria-label="Send message"
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </div>

            <p class="chat-disclaimer">
                Alpha can make mistakes. Verify important information.
            </p>
        </div>

    </div>

</section>
