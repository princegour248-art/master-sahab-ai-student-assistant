<!-- =====================================================

     File: frontend/sections/dashboard.html
     ===================================================== -->

<section id="dashboard-page" class="page active">

    <div class="page-header dashboard-header">
        <div>
            <span class="page-label">
                STUDENT DASHBOARD
            </span>
            <h1>
                Welcome back, Student
                <span class="welcome-wave-icon" title="Welcome">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
                </span>
            </h1>
            <p>
                Learn smarter with Alpha.
            </p>
        </div>

        <div class="dashboard-date-box">
            <span id="dashboard-day">
                Today
            </span>
            <strong id="dashboard-date">
                --
            </strong>
        </div>
    </div>

    <!-- Motivation -->
    <div class="motivation-card">
        <div class="motivation-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>
        </div>
        <div>
            <span>
                DAILY MOTIVATION
            </span>
            <p id="dashboard-motivation">
                Keep learning, keep growing.
            </p>
        </div>
    </div>

    <!-- Statistics -->
    <div class="dashboard-stats">
        <div class="stat-card">
            <div class="stat-icon bg-blue-subtle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div>
                <span>
                    AI Chats
                </span>
                <strong id="dashboard-chat-count">
                    0
                </strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon bg-violet-subtle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
            </div>
            <div>
                <span>
                    Subjects
                </span>
                <strong id="dashboard-subject-count">
                    0
                </strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon bg-emerald-subtle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <div>
                <span>
                    Goals
                </span>
                <strong id="dashboard-goal-count">
                    0
                </strong>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon bg-amber-subtle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>
            </div>
            <div>
                <span>
                    Study Progress
                </span>
                <strong id="goal-percentage">
                    0%
                </strong>
            </div>
        </div>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid">
        <!-- Subjects -->
        <div class="dashboard-panel">
            <div class="panel-header">
                <div>
                    <span class="panel-label">
                        YOUR LEARNING
                    </span>
                    <h2>
                        My Subjects
                    </h2>
                </div>
                <button
                    class="text-button"
                    onclick="showPage('subjects')"
                >
                    View All →
                </button>
            </div>
            <div
                id="dashboard-subjects"
                class="dashboard-subjects"
            ></div>
        </div>

        <!-- Goals -->
        <div class="dashboard-panel">
            <div class="panel-header">
                <div>
                    <span class="panel-label">
                        TODAY
                    </span>
                    <h2>
                        Daily Goals
                    </h2>
                </div>
                <span
                    id="goal-progress-text"
                    class="progress-text"
                >
                    0%
                </span>
            </div>
            <div class="goal-progress">
                <div
                    id="dashboard-goal-progress"
                    class="goal-progress-bar"
                ></div>
            </div>
            <div
                id="dashboard-goal-list"
                class="dashboard-goal-list"
            ></div>
        </div>
    </div>

    <!-- Recent Activity -->
    <div class="dashboard-panel activity-panel">
        <div class="panel-header">
            <div>
                <span class="panel-label">
                    RECENT
                </span>
                <h2>
                    Recent Activity
                </h2>
            </div>
        </div>
        <div
            id="dashboard-activity"
            class="activity-list"
        ></div>
    </div>

</section>
