<section id="subjects-page" class="page">

    <!-- SUBJECT PAGE HEADER -->
    <div class="page-header">
        <div>
            <span class="page-label">
                LEARNING
            </span>
            <h1>
                My Subjects
            </h1>
            <p>
                Organize your subjects, study materials and track your learning progress.
            </p>
        </div>

        <button
            class="primary-btn"
            onclick="openSubjectModal()"
        >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add Subject</span>
        </button>
    </div>

    <!-- SUBJECT TOOLBAR -->
    <div class="subjects-toolbar">
        <div class="subject-search-box">
            <span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input
                id="subject-search"
                type="text"
                placeholder="Search subjects..."
                oninput="searchSubjects()"
                autocomplete="off"
            >
        </div>

        <div class="subject-count-box">
            <span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px; vertical-align: -2px;"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>Total Subjects
            </span>
            <strong id="subject-total-count">
                0
            </strong>
        </div>
    </div>

    <!-- SUBJECTS CONTAINER (Dynamic grid populated by js/subjects.js) -->
    <div
        id="subjects-container"
        class="subjects-container"
    ></div>

    <!-- EMPTY STATE -->
    <div
        id="subjects-empty"
        class="subjects-empty"
    >
        <div class="empty-icon">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        </div>
        <h2>
            No subjects yet
        </h2>
        <p>
            Add your first subject to start tracking your studies.
        </p>
        <button
            class="primary-btn"
            onclick="openSubjectModal()"
        >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add Subject</span>
        </button>
    </div>

</section>
